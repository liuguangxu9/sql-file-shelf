<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b14">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>SQL 文件架</title>
  <style>
    :root { color-scheme: dark; --bg:#070b14; --panel:#0a0f1a; --card:#141c2b; --border:#1c2433; --text:#ebeff7; --muted:#8993a4; --accent:#0ade99; --editor:#060a12; }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:13px "Segoe UI",system-ui,sans-serif;height:100vh;overflow:hidden}
    button,select,input{font:inherit} button{background:transparent;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 10px;cursor:pointer} button:hover{border-color:var(--accent);background:rgba(10,222,153,.08)} button.primary{background:var(--accent);border-color:var(--accent);color:#04271c;font-weight:700} button.primary:hover{background:#36e5ad}.app{height:100%;display:grid;grid-template-rows:52px 1fr 28px}.top{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border);background:var(--panel)}.brand{font-weight:750;letter-spacing:.3px}.brand i{color:var(--accent);font-style:normal}.workspace{min-width:0;flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{display:grid;grid-template-columns:260px minmax(380px,1fr) 245px;min-height:0}.side{background:var(--panel);border-right:1px solid var(--border);padding:14px;overflow:auto}.editorPane{display:grid;grid-template-rows:42px 1fr;min-width:0;background:var(--editor)}.tabs{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border);color:var(--muted)}.fileTitle{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dirty{color:var(--accent)}textarea{width:100%;height:100%;resize:none;border:0;outline:0;padding:18px 20px;background:var(--editor);color:#d9e3ee;font:14px/1.6 Consolas,"Cascadia Code",monospace;tab-size:2}.inspect{background:var(--panel);border-left:1px solid var(--border);padding:14px;overflow:auto}.section{margin:4px 0 18px}.section h2{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}.tree button{width:100%;text-align:left;border:0;border-radius:4px;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tree button:hover,.tree button.active{background:var(--card);color:var(--accent)}.folder{color:#bdc7d5;margin:7px 0 3px}.file{padding-left:16px!important}.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid rgba(28,36,51,.7)}.row span{color:var(--muted)}.field{display:grid;gap:6px;margin:10px 0}.field label{color:var(--muted);font-size:12px}.field select{width:100%;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:7px}.actions{display:grid;gap:8px}.notice{margin-top:14px;padding:9px;background:rgba(10,222,153,.08);border:1px solid rgba(10,222,153,.3);border-radius:6px;color:#b6efd9;font-size:12px;line-height:1.45}.error{color:#ffaaa5;border-color:rgba(255,120,110,.4);background:rgba(255,100,90,.08)}.status{display:flex;align-items:center;padding:0 14px;color:var(--muted);border-top:1px solid var(--border);background:var(--panel);font-size:12px}.empty{padding:25px;color:var(--muted);line-height:1.6}.hidden{display:none}@media(max-width:850px){.main{grid-template-columns:210px 1fr}.inspect{display:none}}
    .workspaceGroup{margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border)}.workspaceHeader{display:flex;gap:4px;align-items:center}.workspaceHeader>button:first-child{flex:1}.tree .removeWorkspace{width:28px;min-width:28px;padding:4px;color:var(--muted);font-size:18px;line-height:18px}.tree .grant{margin:4px 0 4px 8px;width:auto;color:var(--accent);font-size:12px}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="brand">SQL <i>文件架</i></div><div id="workspace" class="workspace">未选择工作区</div><button id="openWorkspace" class="primary">选择工作区</button><button id="restoreWorkspace">恢复访问</button></header>
    <section class="main">
      <aside class="side"><div class="section"><h2>文件</h2><div id="tree" class="tree"><div class="empty">选择一个本地工作目录后，这里会显示 SQL、文本和 Markdown 文件。</div></div></div></aside>
      <section class="editorPane"><div class="tabs"><span id="fileTitle" class="fileTitle">尚未打开文件</span><span id="dirty" class="dirty"></span></div><textarea id="editor" spellcheck="false" disabled aria-label="文件编辑器"></textarea></section>
      <aside class="inspect"><div class="section"><h2>文件信息</h2><div class="row"><span>编码</span><b id="encoding">—</b></div><div class="row"><span>BOM</span><b id="bom">—</b></div><div class="row"><span>换行</span><b id="newline">—</b></div><div class="row"><span>识别</span><b id="confidence">—</b></div></div><div class="section"><h2>保存选项</h2><div class="field"><label for="encodingSelect">保存编码（可手动修正识别结果）</label><select id="encodingSelect" disabled><option value="utf-8">UTF-8</option><option value="utf-16le">UTF-16 LE</option><option value="utf-16be">UTF-16 BE</option><option value="gbk">GBK / CP936</option><option value="gb18030">GB18030</option><option value="windows-1252">Windows-1252</option><option value="windows-1251">Windows-1251</option><option value="shift_jis">Shift_JIS</option></select></div><div class="actions"><button id="save" class="primary" disabled>保存 Ctrl+S</button><button id="saveAs" disabled>另存为</button></div></div><div id="notice" class="notice">文件只会在已授权的本地工作目录中读写。</div></aside>
    </section>
    <footer id="status" class="status">准备就绪</footer>
  </main>
  <script src="./app.js"></script>
</body>
</html>
