<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f9fc">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png?v=2">
    <link rel="manifest" href="./manifest.webmanifest">
    <title>SQL 文件架</title>

  <link rel="stylesheet" href="./workbench.css?v=38"><link rel="stylesheet" href="./app.css?v=38"></head>
  <body class="wb">
    <main class="app wb wb-shell">
      <header class="top">
        <div class="topStart"><button id="toggleNavigation" class="navigationToggle" title="隐藏左侧目录栏（Ctrl+B）" aria-label="隐藏左侧目录栏（Ctrl+B）" aria-controls="directoryNavigation" aria-expanded="true"><svg viewbox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="2"></rect><path d="M7 3v14"></path><path class="sidebarArrow" d="m13 7-3 3 3 3"></path></svg></button>
        <div class="brand">SQL 文件架</div></div>
        <button id="manageWorkspaces" class="workspaceSwitch" popovertarget="workspaceMenu" aria-haspopup="menu" aria-expanded="false"><span id="workspaceName">选择工作区</span><svg class="workspaceChevron" viewbox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3"></path></svg></button>
        <button id="quickOpen" class="quickOpen">搜索文件… <kbd>Ctrl P</kbd></button>
        <div class="top-note" id="workspaceSummary" hidden>正在读取工作区…</div>

      </header>
      <section class="layout wb-layout">

        <aside class="panel navigation" id="directoryNavigation"><div id="navViews" class="wb-nav-views"><button data-view="files" class="active">文件</button><button data-view="recent">最近</button><button data-view="favorites">收藏</button></div><input id="fileSearch" class="search wb-nav-search" placeholder="搜索文件名或文件夹" aria-label="筛选文件名或目录">
          <div class="panelHead">
            <div class="panelTitle">
              <span>文件</span><span class="panelActions"><span class="sortControl">
                  <button id="fileSortButton" title="排序" aria-expanded="false" aria-controls="fileSortMenu">排序 ▾</button>

                </span><button id="refreshFiles" title="刷新当前工作区文件">
                  刷新</button><button id="newFolder" title="在所选目录下新建子目录">新目录</button><button id="newFile" class="primary" title="在所选目录下新建文件">
                  新建</button><span id="fileCount">0 个</span></span>
            </div>

          </div>
          <div class="scroll">
            <div id="fileList" class="fileTree"></div>
            <div id="fileEmpty" class="placeholder">
              选择一个已授权工作区后显示文件。
            </div>
          </div>
        <div id="collectionList" class="scroll" hidden></div></aside><div class="resizer" id="navigationSplitter"></div>
        <section class="panel editorPanel wb-content">
          <div id="editorTabs" role="tablist" aria-label="已打开的文件" class="wb-tabs"></div>
          <header class="editorHead">
            <div class="fileIdentity">
              <strong id="fileTitle">尚未打开文件</strong><small id="filePath">选择本地目录，然后打开文件。</small>
            </div>
            <div class="editorTools">
              <div class="meta">
                <span>编码 <b id="encoding">—</b></span><span>BOM <b id="bom">—</b></span><span>换行 <b id="newline">—</b></span>
              </div>
              <div class="saveControls">
                <button id="favoriteFile" disabled>☆ 收藏</button>
                <button id="findFile" disabled>查找</button><button id="replaceFile" disabled>替换</button>
                <span class="encodingControl">
                <button id="encodingButton" disabled aria-label="保存编码：UTF-8" aria-haspopup="menu" aria-expanded="false" aria-controls="encodingMenu">UTF-8 ▾</button>

                <select id="encodingSelect" hidden disabled aria-label="保存编码">
                  <option value="utf-8">UTF-8</option>
                  <option value="utf-16le">UTF-16 LE</option>
                  <option value="utf-16be">UTF-16 BE</option>
                  <option value="gbk">GBK</option>
                  <option value="gb18030">GB18030</option>
                  <option value="windows-1252">Windows-1252</option>
                  <option value="windows-1251">Windows-1251</option>
                  <option value="shift_jis">Shift_JIS</option>
                </select>
                </span>
                <button id="save" class="primary" disabled>保存</button>
                <button id="saveAs" disabled>另存为</button>
              </div>
            </div>
          </header>
          <div id="findBar" hidden>
            <div class="findRow"><input id="findInput" aria-label="查找文本" placeholder="查找文本…"><label><input type="checkbox" id="matchCase">区分大小写</label><span id="findCount"></span><button id="previousMatch" title="上一个匹配">↑</button><button id="nextMatch" title="下一个匹配">↓</button><button id="closeFind" aria-label="关闭查找">×</button></div>
            <div id="replaceRow" class="findRow" hidden><input id="replaceInput" aria-label="替换为" placeholder="替换为…"><button id="replaceOne">替换当前</button><button id="replaceAll">全部替换</button></div>
          </div>
          <div id="emptyEditor" class="wb-empty"><p>选择本地目录，开始整理与编辑你的脚本。</p><div><button id="emptyQuickOpen" class="primary">快速打开</button></div><div class="shortcutHints"><span><kbd>Ctrl P</kbd> 找文件</span><span><kbd>Ctrl F</kbd> 文件内查找</span><span><kbd>Ctrl S</kbd> 保存</span></div><small>文件保留在你的电脑中 · 保留原编码 · 保存前自动备份</small></div>
          <textarea id="editor" class="editor" title="Alt＋单击添加光标；Alt＋拖动按列添加多个光标" wrap="off" spellcheck="false" disabled aria-label="文件编辑器"></textarea>
        </section>
      </section>
      <footer class="status"><span id="workspaceLocation" class="wb-location" tabindex="0"></span><span id="status" role="status" class="wb-feedback">准备就绪</span><span id="saveState" class="wb-state"></span><span id="cursorStatus" class="wb-state"></span></footer>
    </main>
    <div id="workspaceMenu" class="workspaceMenu" popover="auto" role="menu" aria-label="切换工作区"><div id="workspaceMenuList" class="workspaceMenuList" role="group" aria-label="工作区"></div><div class="workspaceMenuActions" role="group" aria-label="工作区操作"><button id="menuAddWorkspace" class="workspaceOption" role="menuitem">＋ 添加工作区</button><button id="menuManageWorkspaces" class="workspaceOption" role="menuitem">管理工作区…</button></div></div>
    <dialog id="workspaceDialog" class="workspaceDialog wb" aria-label="管理工作区"><header class="dialogHeader"><strong>管理工作区</strong><button id="closeWorkspaces" aria-label="关闭工作区管理">×</button></header><div id="workspaceActions"><button id="addWorkspace" class="primary">＋ 新增工作区</button></div><aside class="panel workspaceManager">
          <div class="panelHead">
            <div class="panelTitle">
              <span>工作区</span><span id="workspaceCount">0 个</span>
            </div>

          </div>
          <div id="workspaceList" class="scroll workspaceList"></div>

        </aside></dialog>
    <dialog id="searchDialog" class="searchDialog wb" aria-label="快速打开文件"><header class="dialogHeader"><strong id="searchTitle">快速打开文件</strong><button id="closeSearch" aria-label="关闭搜索">×</button></header><div id="searchInputHost"><input id="globalSearch" class="search" placeholder="搜索文件名或路径" aria-label="搜索文件名或路径"></div><p id="searchCount"></p><div id="searchResultsHost"><div id="globalResults" class="scroll globalResults"></div></div></dialog>


  <span id="fileSortMenu" class="sortMenu wb wb-popover" popover="auto" role="menu" aria-label="文件排序">
                    <button data-sort-key="name" role="menuitem">文件名</button>
                    <button data-sort-key="modified" role="menuitem">修改时间</button>
                    <button data-sort-key="extension" role="menuitem">格式</button>
                    <span class="sortMenuDivider"></span>
                    <button id="fileSortDirection" role="menuitem">降序 ↓</button>
                  </span><span id="encodingMenu" class="sortMenu wb wb-popover" role="menu" aria-label="保存编码" popover="auto"></span><script src="./app.js?v=38"></script></body>
</html>
