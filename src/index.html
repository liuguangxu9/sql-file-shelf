<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f9fc" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png?v=2" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>SQL 文件架</title>
    <style>
      :root {
        --ink: #172033;
        --muted: #738096;
        --line: #e4e9f1;
        --paper: #fff;
        --soft: #f5f7fb;
        --blue: #276ef1;
        --blue-soft: #eaf1ff;
        --danger: #c93750;
        --workspace-width: 240px;
        --files-width: 330px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: var(--soft);
        color: var(--ink);
        font:
          14px "Segoe UI",
          system-ui,
          sans-serif;
      }
      .app {
        height: 100%;
        display: grid;
        grid-template-rows: 62px 1fr 26px;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
        background: var(--paper);
      }
      .brand {
        font-weight: 800;
        font-size: 17px;
        white-space: nowrap;
      }
      .brand b {
        color: var(--blue);
      }
      .top-note {
        color: var(--muted);
        font-size: 13px;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fff;
        color: var(--ink);
        height: 32px;
        padding: 0 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      button:not(:disabled):hover {
        border-color: #a9c5fb;
      }
      button.primary {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
        font-weight: 650;
      }
      .layout {
        display: grid;
        grid-template-columns:
          var(--workspace-width) 8px var(--files-width)
          8px minmax(420px, 1fr);
        min-height: 0;
      }
      .resizer {
        cursor: col-resize;
        background: var(--soft);
        border-right: 1px solid var(--line);
        transition: background 0.16s;
      }
      .resizer:hover,
      .resizer.dragging {
        background: #bcd3ff;
      }
      .panel {
        min-width: 0;
        background: var(--paper);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
      }
      .panelHead {
        flex: 0 0 96px;
        height: 96px;
        padding: 8px 14px 9px;
        border-bottom: 1px solid var(--line);
      }
      .panelTitle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 32px;
        margin-bottom: 8px;
        font-size: 12px;
        font-weight: 800;
        color: #53627a;
        letter-spacing: 0.5px;
      }
      .panelActions {
        display: flex;
        gap: 5px;
      }
      .panelActions button {
        padding: 0 8px;
        font-size: 12px;
        font-weight: 650;
      }
      .fileDelete {
        flex: 0 0 auto;
        width: 24px;
        height: 24px;
        border: 0;
        background: transparent;
        color: #9aa5b5;
        padding: 0;
        font-size: 16px;
        line-height: 1;
      }
      .fileNameCell {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        min-width: 0;
      }
      .fileNameText {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .fileDelete:not(:disabled):hover {
        color: var(--danger);
      }
      .fileAction {
        flex: 0 0 auto;
        width: 24px;
        height: 24px;
        border: 0;
        background: transparent;
        padding: 0;
        color: #9aa5b5;
        line-height: 1;
      }
      .fileAction:not(:disabled):hover {
        color: var(--blue);
      }
      .fileDialog {
        width: min(430px, calc(100vw - 32px));
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 22px;
        box-shadow: 0 16px 48px #17203333;
      }
      .fileDialog::backdrop { background: #17203355; }
      .fileDialog h2 { margin: 0 0 16px; font-size: 17px; }
      .fileDialog label { display: block; margin: 12px 0; color: #53627a; }
      .fileDialog input,
      .fileDialog select { display: block; width: 100%; margin-top: 5px; padding: 9px; }
      .dialogActions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
      .conflictDialog { width: min(980px, calc(100vw - 32px)); }
      .conflictDialog p { color: var(--muted); }
      .conflictCompare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .conflictCompare section { min-width: 0; }
      .conflictCompare pre {
        height: min(45vh, 360px);
        overflow: auto;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
        white-space: pre;
      }
      .search {
        width: 100%;
        height: 38px;
        border: 1px solid var(--line);
        background: var(--soft);
        border-radius: 8px;
        padding: 0 10px;
        outline: 0;
      }
      .search:focus {
        border-color: var(--blue);
        background: #fff;
        box-shadow: 0 0 0 3px var(--blue-soft);
      }
      .scroll {
        overflow: auto;
        min-height: 0;
      }
      .workspaceList {
        padding: 8px;
      }
      .workspace {
        display: flex;
        gap: 4px;
        margin: 2px 0;
        transition:
          transform 0.18s,
          background 0.18s;
      }
      .workspace.drag-over {
        transform: translateY(3px);
        background: var(--blue-soft);
        border-radius: 7px;
      }
      .workspace button:first-child {
        flex: 1;
        text-align: left;
        border: 0;
        padding: 0 8px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 14px;
      }
      .workspace button.active {
        background: var(--blue-soft);
        color: #1450bd;
        font-weight: 700;
      }
      .workspace .remove {
        width: 28px;
        height: 28px;
        border: 0;
        color: #9aa5b5;
        padding: 0;
        font-size: 18px;
      }
      .grant {
        margin: 2px 8px 8px;
        color: #1759c9;
        border-color: #c9dbff;
        font-size: 12px;
      }
      .globalResults {
        border-top: 1px solid var(--line);
        padding: 7px;
      }
      .result {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        padding: 8px;
        border-radius: 6px;
      }
      .result:not(:disabled):hover {
        background: var(--soft);
      }
      .result strong,
      .result small {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .result small {
        color: var(--muted);
        font-size: 11px;
        margin-top: 2px;
      }
      .sortControl { position: relative; }
      .sortMenu {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        z-index: 10;
        width: 164px;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 12px 32px #17203324;
      }
      .sortMenu[hidden] { display: none; }
      .sortMenu button {
        display: block;
        width: 100%;
        border: 0;
        padding: 7px 9px;
        text-align: left;
      }
      .sortMenu button:not(:disabled):hover, .sortMenu button.selected { background: var(--blue-soft); }
      .sortMenuDivider { height: 1px; margin: 5px 0; background: var(--line); }
      .fileTree { min-width: 0; }
      .fileTree > div { border-bottom: 1px solid #f0f3f7; }
      .folderRow { padding: 5px 10px; background: #fafbfd; cursor: pointer; transition: background-color .18s ease, box-shadow .18s ease; }
      .folderRow.open { background: #f8faff; }
      .folderRow.selected { box-shadow: inset 2px 0 #9dc3f2; }
      .folderRow:hover { background: #edf3fb; }
      .treeNameCell { display: flex; align-items: center; min-width: 0; }
      .treeToggle {
        flex: 0 0 24px;
        width: 24px;
        height: 24px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 6px;
        padding: 0;
        background: transparent;
        color: #647b99;
      }
      .treeToggle:not(:disabled):hover { background: #e8f0fb; color: #235caf; }
      .treeToggle svg { display: block; width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; transform: rotate(0deg); }
      .folderRow.open .treeToggle svg { transform: rotate(90deg); }
      .folderIcon { width: 17px; height: 17px; flex: 0 0 17px; margin: 0 6px 0 5px; fill: #e7eef8; stroke: #6886ae; stroke-width: 1.5; }
      .folderRow.open .folderIcon { fill: #dbe9fc; stroke: #3c70b7; }
      .folderPick {
        flex: 1;
        min-width: 0;
        border: 0;
        padding: 4px 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        background: transparent;
        color: #244c88;
        font-weight: 750;
        text-align: left;
        font-size: 14px;
      }
      .folderPick:not(:disabled):hover { color: var(--blue); }
      .fileRow { display: grid; grid-template-columns: minmax(0, 1fr) auto; padding: 6px 10px 5px; cursor: pointer; background: #fff; transition: background-color .18s ease, box-shadow .18s ease; }
      .fileRow .fileNameCell { grid-column: 1; grid-row: 1; }
      .fileRow .fileMeta { grid-column: 1; grid-row: 2; }
      .fileRowActions { grid-column: 2; grid-row: 1 / span 2; display: flex; align-items: center; gap: 6px; }
      .fileRow.nested { position: relative; }
      .fileRow.nested::before { content: ""; position: absolute; top: 0; bottom: 0; left: calc(36px + (var(--tree-depth) - 1) * 20px); width: 1px; background: #e0e7f0; }
      .fileRow:hover:not(.active) { background: #f5f8fc; }
      .fileRow.active { background: #dceaff; box-shadow: inset 3px 0 var(--blue); }
      .fileIcon { flex: 0 0 auto; color: #6686b9; font-size: 13px; }
      .fileRow .fileNameText { color: var(--ink); font-weight: 650; }
      .fileRow.active .fileNameText { color: #174f9f; }
      .fileMeta { margin-top: 2px; color: var(--muted); font-size: 11px; }
      @media (prefers-reduced-motion: reduce) {
        .folderRow, .fileRow { transition: none; }
      }
      .editorPanel {
        border-right: 0;
        background: #fff;
        container-type: inline-size;
      }
      .editorHead {
        flex: 0 0 96px;
        height: 96px;
        padding: 9px 16px;
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
      }
      .editorHead button,
      .editorHead select {
        flex-shrink: 0;
        white-space: nowrap;
      }
      .fileIdentity {
        width: 100%;
        min-width: 0;
        display: flex;
        align-items: baseline;
        gap: 12px;
      }
      .fileIdentity strong { font-size: 14px; flex: 0 1 auto; max-width: 68%; }
      .fileIdentity strong,
      .fileIdentity small {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .fileIdentity small {
        color: var(--muted);
        font-size: 12px;
        flex: 1 1 0;
        min-width: 0;
      }
      .editorTools {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        min-width: 0;
      }
      .meta {
        display: flex;
        min-width: 0;
        overflow: hidden;
        gap: 10px;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .meta b {
        color: var(--ink);
        font-weight: 650;
      }
      .saveControls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
      .saveControls select {
        width: 114px;
        height: 32px;
        padding: 0 8px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fff;
        font-size: 12px;
      }
      @container (max-width: 620px) {
        .meta span:nth-child(n+2) { display: none; }
        .saveControls select { width: 100px; }
      }
      .editorShell {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        background: #fff;
      }
      .lineNumbers {
        position: absolute;
        z-index: 2;
        top: 0;
        left: 0;
        width: 56px;
        height: 100%;
        padding: 22px 10px 22px 0;
        text-align: right;
        overflow: hidden;
        color: #a4aebe;
        background: #f8fafc;
        border-right: 1px solid var(--line);
        font:
          14px/1.7 Consolas,
          "Cascadia Code",
          monospace;
        pointer-events: none;
        white-space: pre;
      }
      .highlight {
        position: absolute;
        z-index: 1;
        inset: 0;
        overflow: hidden;
        margin: 0;
        padding: 22px 26px 22px 78px;
        color: #192235;
        background: #fff;
        font:
          14px/1.7 Consolas,
          "Cascadia Code",
          monospace;
        tab-size: 2;
        white-space: pre;
        overflow-wrap: normal;
        pointer-events: none;
      }
      .highlight code {
        display: block;
        font: inherit;
      }
      .editor {
        position: absolute;
        z-index: 3;
        inset: 0;
        width: 100%;
        height: 100%;
        resize: none;
        border: 0;
        outline: 0;
        padding: 22px 26px 22px 78px;
        background: transparent;
        color: transparent;
        caret-color: #172033;
        font:
          14px/1.7 Consolas,
          "Cascadia Code",
          monospace;
        tab-size: 2;
        white-space: pre;
        overflow: auto;
      }
      .editor::selection {
        background: rgba(39, 110, 241, 0.22);
      }
      .editorShell.plainEditor .editor { color: #192235; }
      .editorShell.plainEditor .highlight { visibility: hidden; }
      .editorShell.plainEditor .lineNumbers { display: none; }
      .editorShell.plainEditor .editor { padding-left: 26px; }
      .secondaryCursors {
        position: absolute;
        z-index: 4;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .secondaryCursor {
        position: absolute;
        width: 2px;
        background: #1766e8;
        box-shadow: 0 0 0 1px #fff, 0 0 7px rgba(23, 102, 232, .35);
        animation: multiCaretBlink 1s steps(1) infinite;
      }
      @keyframes multiCaretBlink { 50% { opacity: .15; } }
      @media (prefers-reduced-motion: reduce) {
        .secondaryCursor { animation: none; }
      }
      .sql-keyword {
        color: #7655d5;
        font-weight: 700;
      }
      .sql-string {
        color: #b05b17;
      }
      .sql-comment {
        color: #7e8a9a;
        font-style: italic;
      }
      .sql-number {
        color: #0d7d75;
      }
      .placeholder {
        padding: 26px 14px;
        color: var(--muted);
        line-height: 1.7;
      }
      .status {
        background: var(--paper);
        border-top: 1px solid var(--line);
        color: var(--muted);
        padding: 5px 18px;
        font-size: 12px;
      }
      .error {
        color: var(--danger);
      }
      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 210px 8px 280px 8px minmax(420px, 1fr);
        }
      }

      /* Workbench v23: compact navigation and content-first layout. */
      [hidden] { display: none !important; }
      :root { --files-width: 280px; --ink: #243047; --line: #e7ebf1; }
      body { font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; }
      .app { grid-template-rows: 56px minmax(0,1fr) 29px; }
      .top { display:grid; grid-template-columns:auto minmax(0,1fr) minmax(60px,330px); gap:12px; padding:0 16px; background:#f9fafc; }
      .topStart { display:flex; align-items:center; gap:8px; min-width:0; padding-right:16px; border-right:1px solid var(--line); }
      .brand { display:flex; align-items:center; font-size:13px; font-weight:500; color:#788396; letter-spacing:.2px; }
      button { font-weight:500; border-radius:6px; }
      button:focus-visible, input:focus-visible { outline:2px solid #729cf2; outline-offset:2px; }
      button:disabled { opacity:.45; cursor:default; }

      .workspaceSwitch { display:flex; align-items:center; justify-content:flex-start; justify-self:start; gap:8px; width:fit-content; max-width:240px; min-width:0; border-color:transparent; background:transparent; color:#35435a; font-size:14px; font-weight:600; }
      .workspaceSwitch:not(:disabled):hover,.workspaceSwitch[aria-expanded="true"] { background:#edf0f5; border-color:transparent; }
      #workspaceName { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .workspaceChevron { flex-shrink:0; width:12px; height:12px; fill:none; stroke:#8a95a6; stroke-width:1.5; }
      .workspaceMenu { position:fixed; inset:auto; margin:0; width:min(300px,calc(100vw - 24px)); padding:6px; border:1px solid #e3e8ef; border-radius:10px; background:#fff; color:var(--ink); box-shadow:0 10px 32px #2430471a; }
      .workspaceMenu::backdrop { background:transparent; }
      .workspaceMenuList { max-height: min(320px,50vh); overflow-y:auto; }
      .workspaceOption { display:flex; align-items:center; gap:10px; width:100%; padding:0 10px; height:38px; border:0; background:transparent; text-align:left; font-size:13px; color:#536078; }
      .workspaceOption:not(:disabled):hover,.workspaceOption:focus-visible { background:#f1f4f9; }
      .workspaceOption[aria-checked="true"] { color:#3265bc; background:#f0f5fe; }
      .workspaceOption .workspaceOptionName { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .workspaceCheck { width:16px; font-size:14px; }
      .workspaceMenuActions { border-top:1px solid #edf0f5; margin-top:6px; padding-top:6px; }
      .workspaceMenuEmpty { padding:16px 10px; color:#909aab; font-size:12px; }
      .quickOpen { justify-self:end; min-width:0; width:min(330px,100%); display:flex; align-items:center; justify-content:space-between; color:#76839a; background:#fff; }
      kbd { font:11px "Segoe UI", sans-serif; color:#7a8799; background:#f4f6f9; border:1px solid #e4e9ef; border-radius:4px; padding:2px 5px; }
      .layout { grid-template-columns: minmax(220px, var(--files-width)) 5px minmax(0, 1fr); }
      .layout.navigationHidden { grid-template-columns:minmax(0,1fr); }
      .navigationHidden > .navigation,.navigationHidden > .resizer { display:none; }
      .navigation { background:#f9fafc; }
      .navigationToggle { display:flex; align-items:center; gap:6px; border:1px solid transparent; background:transparent; color:#8490a1; width:30px; height:30px; justify-content:center; padding:0; white-space:nowrap; }
      .navigationToggle:not(:disabled):hover { background:#edf0f5; color:#536078; }
      .navigationToggle svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.5; }
      .navigationToggle .sidebarArrow { transform-origin:11.5px 10px; transition:transform .15s; }
      .navigationToggle.collapsed .sidebarArrow { transform:rotate(180deg); }
      .treeToggle svg { transition:transform .12s ease; }
      .folderActions { display:flex; align-items:center; gap:0; opacity:0; }
      .folderRow:hover .folderActions,.folderRow:focus-within .folderActions { opacity:1; }
      .navigation .panelHead { height:48px; flex-basis:48px; padding:8px 12px; border:0; }
      .navigation .panelTitle { margin:0; font-weight:500; }
      #navViews { order:-2; display:flex; gap:4px; padding:12px 12px 8px; }
      #navViews button { flex:1; border:0; color:#778397; background:transparent; }
      #navViews button.active { background:#e9eef8; color:#285ebc; font-weight:600; }
      #fileSearch { order:-1; margin:0 12px 4px; width:calc(100% - 24px); height:32px; font-size:12px; background:#fff; }
      .resizer { border:0; background:#f0f3f7; }
      .fileRow { padding-top:7px; padding-bottom:7px; background:transparent; border:0; }
      .fileTree > div { border-bottom:0; }
      .fileRow .fileNameText, .folderPick { font-weight:500; font-size:13px; }
      .folderRow { background:transparent; }
      .folderRow.open { background:transparent; }
      .folderRow.selected, .folderRow.selected:hover { background:transparent; }
      .folderPick { display:flex; align-items:center; gap:13px; }
      .folderName { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .folderCounts { display:flex; flex-shrink:0; align-items:center; gap:12px; color:#8b96a6; font-size:11px; font-weight:400; font-variant-numeric:tabular-nums; }
      .folderCount { display:flex; align-items:center; gap:4px; }
      .folderCount svg { width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:1.25; stroke-linecap:round; stroke-linejoin:round; }
      .fileRow.active { background:#e8effc; box-shadow:inset 2px 0 #3971db; }
      .fileRowActions { gap:0; opacity:0; }
      .fileRow:hover .fileRowActions,.fileRow:focus-within .fileRowActions { opacity:1; }
      .fileMeta { font-size:10px; color:#8b96a6; }
      #editorTabs { display:flex; flex-shrink:0; overflow-x:auto; min-height:40px; background:#f4f6fa; border-bottom:1px solid var(--line); }
      .editorTab { display:flex; flex-shrink:0; align-items:center; border-right:1px solid var(--line); border-top:2px solid transparent; max-width:260px; cursor:grab; user-select:none; }
      .editorTab.dragging { opacity:.4; background:#e8effc; }
      .editorTab > button:first-child { cursor:grab; }
      .tabDropIndicator { position:fixed; width:3px; z-index:30; background:#276ef1; border-radius:2px; pointer-events:none; box-shadow:0 0 0 2px #fff; }
      .tabDropIndicator::before,.tabDropIndicator::after { content:""; position:absolute; left:-2px; width:7px; height:5px; border-radius:2px; background:#276ef1; }
      .tabDropIndicator::before { top:0; }.tabDropIndicator::after { bottom:0; }
      .editorTab.selected { border-top-color:#3c72dc; background:#fff; }
      .editorTab button { border:0; background:transparent; height:36px; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .editorTab .closeTab { flex-shrink:0; padding:0 9px; color:#8b95a6; }
      .tabsPlaceholder { align-self:center; padding:0 18px; color:#8b95a6; font-size:12px; }
      .editorHead { flex-basis:76px; height:76px; padding:8px 18px; gap:7px; }
      .fileIdentity strong { font-size:13px; font-weight:550; }
      .fileIdentity small { font-size:11px; color:#8a95a6; }
      .editorTools { gap:8px; }
      .meta { font-size:10px; gap:7px; }
      .saveControls { gap:5px; }
      .saveControls button { font-size:11px; height:28px; padding:0 8px; }
      .encodingControl { position:relative; flex-shrink:0; }
      #encodingButton { min-width:92px; font-size:12px; }
      #encodingMenu { left:auto; right:0; }
      #encodingMenu button { height:32px; padding:7px 9px; font-size:12px; }
      .editorPanel { position:relative; min-width:0; }
      #emptyEditor { position:absolute; top:116px; bottom:0; left:0; right:0; z-index:5; background:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:24px; text-align:center; }
      #emptyEditor p { color:#8b95a6; font-size:13px; margin:12px 0 24px; }
      #emptyEditor button { margin:0 5px; height:36px; }
      .shortcutHints { display:flex; gap:20px; margin:36px 0 22px; color:#8b95a6; font-size:11px; }
      #emptyEditor small { color:#a0a9b7; font-size:11px; }
      .status { position:relative; z-index:4; min-width:0; overflow:hidden; display:flex; align-items:center; gap:18px; padding:0 14px; font-size:10px; background:#f9fafc; }
      #status { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      #workspaceLocation { flex:0 1 auto; min-width:0; max-width:40%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      #saveState,#cursorStatus { flex-shrink:0; white-space:nowrap; }
      .unsaved { color:#b67a23; }
      .workspaceDialog,.searchDialog { border:1px solid #dfe5ef; border-radius:14px; padding:0; box-shadow:0 24px 90px #23365630; color:var(--ink); }
      dialog::backdrop { background:#182c4d45; backdrop-filter:blur(3px); }
      .workspaceDialog { width:min(460px,90vw); max-height:80vh; }
      .workspaceDialog .panel { border:0; }
      .dialogHeader { display:flex; align-items:center; justify-content:space-between; padding:16px 20px 10px; }
      .dialogHeader strong { font-size:15px; font-weight:600; }
      .dialogHeader button { border:0; background:transparent; font-size:19px; color:#8391a7; }
      #workspaceActions { padding:0 20px 8px; }
      .workspaceDialog .workspaceList { max-height:50vh; }
      .searchDialog { width:min(760px,90vw); margin-top:12vh; }
      #searchInputHost { padding:6px 20px; }
      #globalSearch { height:42px; background:#f8fafe; }
      #searchCount { color:#8b95a6; font-size:11px; padding:0 20px; }
      #globalResults { max-height:50vh; padding:8px 12px; }
      .result { height:auto; padding:12px; border-radius:8px; margin-bottom:3px; }
      .result strong { font-size:13px; font-weight:550; }
      .result code { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:8px; font:12px Consolas,monospace; color:#597295; }
      .collectionItem { display:block; text-align:left; border:0; background:transparent; width:100%; height:auto; padding:12px 16px; }
      .collectionItem:not(:disabled):hover { background:#eaf0fa; }
      .collectionItem strong,.collectionItem small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .collectionItem strong { font-size:13px; font-weight:500; }.collectionItem small { color:#8793a5; margin-top:5px; font-size:10px; }
      #findBar { padding:10px 16px; background:#f7f9fc; border-bottom:1px solid var(--line); flex-shrink:0; }
      .findRow { display:flex; align-items:center; gap:7px; }
      .findRow + .findRow { margin-top:7px; }
      .findRow > input { width:240px; min-width:60px; flex:1; border:1px solid var(--line); border-radius:5px; padding:7px 9px; font-size:12px; }
      .findRow label { font-size:11px; white-space:nowrap; }.findRow label input { vertical-align:middle; }
      #findCount { font-size:11px; color:#8793a5; white-space:nowrap; }
      .lineNumbers,.highlight,.editor { font-size:14px; line-height:1.7; }
      @container (max-width:700px) { .meta { display:none; } .saveControls { flex-wrap:wrap; } }
      @media(max-width:900px) { .layout { grid-template-columns:240px 5px minmax(0,1fr); } .top { gap:7px; } .brand { font-size:13px; } .workspaceSwitch { max-width:150px; } }
      @media(max-width:650px) { .layout { grid-template-columns:minmax(0,1fr); } .navigation,.layout > .resizer { display:none; } .layout.navigationHidden { grid-template-columns:minmax(0,1fr); } .layout:not(.navigationHidden) .navigation { display:flex; } .layout:not(.navigationHidden) .editorPanel { display:none; } .quickOpen kbd { display:none; } .brand { font-size:12px; } .quickOpen { min-width:60px; } .workspaceSwitch { max-width:110px; } .top { padding:0 8px; } .shortcutHints { gap:10px; } #workspaceLocation { display:none; } .findRow { flex-wrap:wrap; } }
      @media(max-width:650px) { .top { grid-template-columns:auto minmax(0,1fr) auto; } .topStart { gap:4px; padding-right:8px; } .workspaceSwitch { max-width:100%; padding:0 6px; font-size:13px; gap:5px; } .quickOpen { width:100px; font-size:11px; padding:0 5px; } }
      @media(max-width:400px) { .brand { max-width:64px; overflow:hidden; text-overflow:ellipsis; } .top { gap:4px; } .quickOpen { width:68px; } }
      .navigation .panelTitle > span:first-child { display:none; }
      .navigation .panelActions { width:100%; align-items:center; gap:5px; }
      .navigation .panelActions button { white-space:nowrap; padding:0 6px; font-size:11px; }
      #fileCount { margin-left:auto; font-size:10px; white-space:nowrap; color:#8b95a6; }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div class="topStart"><button id="toggleNavigation" class="navigationToggle" title="隐藏左侧目录栏（Ctrl+B）" aria-label="隐藏左侧目录栏（Ctrl+B）" aria-controls="directoryNavigation" aria-expanded="true"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="2"/><path d="M7 3v14"/><path class="sidebarArrow" d="m13 7-3 3 3 3"/></svg></button>
        <div class="brand">SQL 文件架</div></div>
        <button id="manageWorkspaces" class="workspaceSwitch" popovertarget="workspaceMenu" aria-haspopup="menu" aria-expanded="false"><span id="workspaceName">选择工作区</span><svg class="workspaceChevron" viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg></button>
        <button id="quickOpen" class="quickOpen">搜索文件… <kbd>Ctrl P</kbd></button>
        <div class="top-note" id="workspaceSummary">正在读取工作区…</div>
        <button id="addWorkspace" class="primary">＋ 新增工作区</button>
      </header>
      <section class="layout">
        <aside class="panel">
          <div class="panelHead">
            <div class="panelTitle">
              <span>工作区</span><span id="workspaceCount">0 个</span>
            </div>
            <input
              id="globalSearch"
              class="search"
              placeholder="搜索所有工作区内容"
            />
          </div>
          <div id="workspaceList" class="scroll workspaceList"></div>
          <div id="globalResults" class="scroll globalResults"></div>
        </aside>
        <aside class="panel">
          <div class="panelHead">
            <div class="panelTitle">
              <span>文件</span
              ><span class="panelActions"
                ><span class="sortControl">
                  <button id="fileSortButton" title="排序" aria-expanded="false" aria-controls="fileSortMenu">排序 ▾</button>
                  <span id="fileSortMenu" class="sortMenu" hidden>
                    <button data-sort-key="name">文件名</button>
                    <button data-sort-key="modified">修改时间</button>
                    <button data-sort-key="extension">格式</button>
                    <span class="sortMenuDivider"></span>
                    <button id="fileSortDirection">降序 ↓</button>
                  </span>
                </span><button id="refreshFiles" title="刷新当前工作区文件">
                  刷新</button
                ><button
                  id="newFolder"
                  title="在所选目录下新建子目录"
                >新目录</button
                ><button
                  id="newFile"
                  class="primary"
                  title="在所选目录下新建文件"
                >
                  新建</button
                ><span id="fileCount">0 个</span></span
              >
            </div>
            <input
              id="fileSearch"
              class="search"
              placeholder="搜索文件名或文件夹"
            />
          </div>
          <div class="scroll">
            <div id="fileList" class="fileTree"></div>
            <div id="fileEmpty" class="placeholder">
              选择一个已授权工作区后显示文件。
            </div>
          </div>
        </aside>
        <section class="panel editorPanel">
          <div id="editorTabs" role="tablist" aria-label="已打开的文件"></div>
          <header class="editorHead">
            <div class="fileIdentity">
              <strong id="fileTitle">尚未打开文件</strong
              ><small id="filePath">选择本地目录，然后打开文件。</small>
            </div>
            <div class="editorTools">
              <div class="meta">
                <span>编码 <b id="encoding">—</b></span
                ><span>BOM <b id="bom">—</b></span
                ><span>换行 <b id="newline">—</b></span>
              </div>
              <div class="saveControls">
                <button id="favoriteFile" disabled>☆ 收藏</button>
                <button id="findFile" disabled>查找</button><button id="replaceFile" disabled>替换</button>
                <span class="encodingControl">
                <button id="encodingButton" disabled aria-label="保存编码：UTF-8" aria-haspopup="menu" aria-expanded="false" aria-controls="encodingMenu">UTF-8 ▾</button>
                <span id="encodingMenu" class="sortMenu" role="menu" aria-label="保存编码" hidden></span>
                <select id="encodingSelect" hidden disabled aria-label="保存编码">
                  <option value="utf-8">UTF-8</option>
                  <option value="utf-16le">UTF-16 LE</option>
                  <option value="utf-16be">UTF-16 BE</option>
                  <option value="gbk">GBK</option>
                  <option value="gb18030">GB18030</option>
                  <option value="windows-1252">Windows-1252</option>
                  <option value="windows-1251">Windows-1251</option>
                  <option value="shift_jis">Shift_JIS</option>
                </select>
                </span>
                <button id="save" class="primary" disabled>保存</button>
                <button id="saveAs" disabled>另存为</button>
              </div>
            </div>
          </header>
          <div id="findBar" hidden>
            <div class="findRow"><input id="findInput" aria-label="查找文本" placeholder="查找文本…"><label><input type="checkbox" id="matchCase">区分大小写</label><span id="findCount"></span><button id="previousMatch" title="上一个匹配">↑</button><button id="nextMatch" title="下一个匹配">↓</button><button id="closeFind" aria-label="关闭查找">×</button></div>
            <div id="replaceRow" class="findRow" hidden><input id="replaceInput" aria-label="替换为" placeholder="替换为…"><button id="replaceOne">替换当前</button><button id="replaceAll">全部替换</button></div>
          </div>
          <div id="emptyEditor"><p>选择本地目录，开始整理与编辑你的脚本。</p><div><button id="emptyQuickOpen" class="primary">快速打开</button></div><div class="shortcutHints"><span><kbd>Ctrl P</kbd> 找文件</span><span><kbd>Ctrl F</kbd> 文件内查找</span><span><kbd>Ctrl S</kbd> 保存</span></div><small>文件保留在你的电脑中 · 保留原编码 · 保存前自动备份</small></div>
          <textarea
            id="editor"
            class="editor"
            title="Alt＋单击添加光标；Alt＋拖动按列添加多个光标"
            wrap="off"
            spellcheck="false"
            disabled
            aria-label="文件编辑器"
          ></textarea>
        </section>
      </section>
      <footer class="status"><span id="workspaceLocation"></span><span id="status" role="status">准备就绪</span><span id="saveState"></span><span id="cursorStatus"></span></footer>
    </main>
    <div id="workspaceMenu" class="workspaceMenu" popover="auto" role="menu" aria-label="切换工作区"><div id="workspaceMenuList" class="workspaceMenuList" role="group" aria-label="工作区"></div><div class="workspaceMenuActions" role="group" aria-label="工作区操作"><button id="menuAddWorkspace" class="workspaceOption" role="menuitem">＋ 添加工作区</button><button id="menuManageWorkspaces" class="workspaceOption" role="menuitem">管理工作区…</button></div></div>
    <dialog id="workspaceDialog" class="workspaceDialog"><header class="dialogHeader"><strong>管理工作区</strong><button id="closeWorkspaces" aria-label="关闭工作区管理">×</button></header><div id="workspaceActions"></div></dialog>
    <dialog id="searchDialog" class="searchDialog"><header class="dialogHeader"><strong id="searchTitle">快速打开文件</strong><button id="closeSearch" aria-label="关闭搜索">×</button></header><div id="searchInputHost"></div><p id="searchCount"></p><div id="searchResultsHost"></div></dialog>
    <div id="navViews"><button data-view="files" class="active">文件</button><button data-view="recent">最近</button><button data-view="favorites">收藏</button></div><div id="collectionList" class="scroll" hidden></div>
    <script src="./app.js?v=33"></script>
  </body>
</html>
