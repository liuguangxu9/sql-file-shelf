<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f9fc"><link rel="manifest" href="./manifest.webmanifest"><title>SQL 文件架</title><style>
:root{--ink:#172033;--muted:#738096;--line:#e4e9f1;--paper:#fff;--soft:#f5f7fb;--blue:#276ef1;--blue-soft:#eaf1ff;--danger:#c93750}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--soft);color:var(--ink);font:14px "Segoe UI",system-ui,sans-serif}.app{height:100%;display:grid;grid-template-rows:62px 1fr 26px}.top{display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--paper)}.brand{font-weight:800;font-size:17px;white-space:nowrap}.brand b{color:var(--blue)}.top-note{color:var(--muted);font-size:13px}button,input,select{font:inherit}button{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:8px 11px;cursor:pointer}button:hover{border-color:#a9c5fb}button.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:650}.layout{display:grid;grid-template-columns:240px 330px minmax(520px,1fr);min-height:0}.panel{min-width:0;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column}.panelHead{padding:14px 14px 10px;border-bottom:1px solid var(--line)}.panelTitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:12px;font-weight:800;color:#53627a;letter-spacing:.5px}.search{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:9px 10px;outline:0}.search:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px var(--blue-soft)}.scroll{overflow:auto;min-height:0}.workspaceList{padding:8px}.workspace{display:flex;gap:4px;margin:2px 0}.workspace button:first-child{flex:1;text-align:left;border:0;padding:9px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.workspace button.active{background:var(--blue-soft);color:#1450bd;font-weight:700}.workspace .remove{border:0;color:#9aa5b5;padding:4px 8px;font-size:18px}.grant{margin:2px 8px 8px;color:#1759c9;border-color:#c9dbff;font-size:12px}.globalResults{border-top:1px solid var(--line);padding:7px}.result{display:block;width:100%;text-align:left;border:0;padding:8px;border-radius:6px}.result:hover{background:var(--soft)}.result strong,.result small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.result small{color:var(--muted);font-size:11px;margin-top:2px}.fileTable{width:100%;border-collapse:collapse;table-layout:fixed}.fileTable th{text-align:left;color:var(--muted);font-size:11px;font-weight:650;padding:9px 13px;border-bottom:1px solid var(--line)}.fileTable td{padding:9px 13px;border-bottom:1px solid #eef1f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fileTable tr{cursor:pointer}.fileTable tbody tr:hover,.fileTable tbody tr.active{background:var(--blue-soft)}.fileTable .name{width:54%;font-weight:600}.fileTable .time{width:29%;color:var(--muted);font-size:12px}.fileTable .type{width:17%;color:#5071ad;font-size:11px;text-transform:uppercase}.editorPanel{border-right:0;background:#fff}.editorHead{padding:0 20px;height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}.fileIdentity{flex:1;min-width:0}.fileIdentity strong,.fileIdentity small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fileIdentity small{color:var(--muted);font-size:12px;margin-top:2px}.meta{display:flex;gap:10px;color:var(--muted);font-size:12px;white-space:nowrap}.meta b{color:var(--ink);font-weight:650}.editor{flex:1;width:100%;resize:none;border:0;outline:0;padding:22px 26px;background:#fff;color:#192235;font:14px/1.7 Consolas,"Cascadia Code",monospace;tab-size:2}.placeholder{padding:26px 14px;color:var(--muted);line-height:1.7}.status{background:var(--paper);border-top:1px solid var(--line);color:var(--muted);padding:5px 18px;font-size:12px}.error{color:var(--danger)}@media(max-width:980px){.layout{grid-template-columns:210px 280px minmax(440px,1fr)}.meta{display:none}}
</style></head><body><main class="app"><header class="top"><div class="brand">SQL <b>文件架</b></div><div class="top-note" id="workspaceSummary">正在读取工作区…</div><button id="addWorkspace" class="primary">＋ 新增工作区</button></header><section class="layout"><aside class="panel"><div class="panelHead"><div class="panelTitle"><span>工作区</span><span id="workspaceCount">0 个</span></div><input id="globalSearch" class="search" placeholder="搜索所有工作区内容"></div><div id="workspaceList" class="scroll workspaceList"></div><div id="globalResults" class="scroll globalResults"></div></aside><aside class="panel"><div class="panelHead"><div class="panelTitle"><span>文件</span><span id="fileCount">0 个</span></div><input id="fileSearch" class="search" placeholder="筛选当前工作区文件"></div><div class="scroll"><table class="fileTable"><thead><tr><th class="name">文件名</th><th class="time">修改时间</th><th class="type">格式</th></tr></thead><tbody id="fileList"></tbody></table><div id="fileEmpty" class="placeholder">选择一个已授权工作区后显示文件。</div></div></aside><section class="panel editorPanel"><header class="editorHead"><div class="fileIdentity"><strong id="fileTitle">尚未打开文件</strong><small id="filePath">从左侧选择工作区，再从中间打开文件。</small></div><div class="meta"><span>编码 <b id="encoding">—</b></span><span>BOM <b id="bom">—</b></span><span>换行 <b id="newline">—</b></span></div><select id="encodingSelect" disabled aria-label="保存编码"><option value="utf-8">UTF-8</option><option value="utf-16le">UTF-16 LE</option><option value="utf-16be">UTF-16 BE</option><option value="gbk">GBK</option><option value="gb18030">GB18030</option><option value="windows-1252">Windows-1252</option><option value="windows-1251">Windows-1251</option><option value="shift_jis">Shift_JIS</option></select><button id="save" class="primary" disabled>保存</button><button id="saveAs" disabled>另存为</button></header><textarea id="editor" class="editor" spellcheck="false" disabled aria-label="文件编辑器"></textarea></section></section><footer id="status" class="status">准备就绪</footer></main><script src="./app.js"></script></body></html>
